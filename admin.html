<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1f3a">
<title>FARFITS Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6f9;
  --bg-2: #eef1f6;
  --ink: #0b1f3a;
  --ink-2: #1a2f4a;
  --cd: #ffffff;
  --cd-hover: #f8fafc;
  --li: #c9a14a;
  --li-soft: rgba(201, 161, 74, 0.12);
  --li-strong: #b08d3a;
  --rd: #d6333a;
  --rd-soft: rgba(214, 51, 58, 0.1);
  --gn: #1f8a4c;
  --gn-soft: rgba(31, 138, 76, 0.1);
  --mu: #5b6678;
  --mu-2: #8a94a6;
  --ln: rgba(11, 31, 58, 0.09);
  --ln-strong: rgba(11, 31, 58, 0.16);
  --shadow-sm: 0 1px 2px rgba(11, 31, 58, 0.04);
  --shadow: 0 4px 16px rgba(11, 31, 58, 0.06);
  --shadow-lg: 0 12px 40px rgba(11, 31, 58, 0.1);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --sidebar-w: 240px;
  --sidebar-bg: #0b1f3a;
  --sidebar-text: rgba(255, 255, 255, 0.62);
  --sidebar-text-active: #ffffff;
  --transition: 0.18s ease;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #080f1a;
    --bg-2: #0c1524;
    --ink: #eef1f6;
    --ink-2: #d0d7e4;
    --cd: #111c30;
    --cd-hover: #16233a;
    --li: #d4b05e;
    --li-soft: rgba(212, 176, 94, 0.15);
    --li-strong: #e0c070;
    --mu: #8b97ab;
    --mu-2: #6b778c;
    --ln: rgba(255, 255, 255, 0.07);
    --ln-strong: rgba(255, 255, 255, 0.12);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.35);
    --sidebar-bg: #0a1528;
  }
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  font-size: 15px;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  letter-spacing: -0.025em;
  font-weight: 700;
  line-height: 1.25;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2.5px solid var(--li);
  outline-offset: 2px;
}

img { max-width: 100%; display: block; }

/* ========== Buttons ========== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  border: 1.5px solid transparent;
  background: var(--ink);
  color: var(--bg);
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background var(--transition), transform 0.1s, box-shadow var(--transition);
  white-space: nowrap;
  user-select: none;
}
.btn:hover { background: var(--ink-2); }
.btn:active { transform: scale(0.98); }
.btn.o {
  background: transparent;
  color: var(--ink);
  border-color: var(--ln-strong);
}
.btn.o:hover { background: var(--li-soft); border-color: var(--li); color: var(--li-strong); }
.btn.r {
  background: var(--rd);
  border-color: var(--rd);
  color: #fff;
}
.btn.r:hover { background: #c02a30; }
.btn.s {
  padding: 5px 11px;
  font-size: 0.82rem;
  border-radius: 6px;
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* ========== Form controls ========== */
input, select, textarea {
  width: 100%;
  padding: 10px 13px;
  background: var(--cd);
  border: 1.5px solid var(--ln);
  border-radius: var(--radius-sm);
  transition: border-color var(--transition), box-shadow var(--transition);
}
input:hover, select:hover, textarea:hover {
  border-color: var(--ln-strong);
}
input:focus, select:focus, textarea:focus {
  border-color: var(--li);
  box-shadow: 0 0 0 3px var(--li-soft);
  outline: none;
}
input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--li);
  cursor: pointer;
}
input[type="file"] {
  padding: 8px;
  font-size: 0.88rem;
}
label {
  display: block;
  font-size: 0.84rem;
  font-weight: 500;
  color: var(--mu);
  margin: 14px 0 5px;
}
label:first-child { margin-top: 0; }

/* ========== Login ========== */
#login {
  max-width: 380px;
  margin: min(18vh, 120px) auto;
  padding: 2.2rem 2rem;
  background: var(--cd);
  border: 1px solid var(--ln);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
}
#login h2 {
  font-size: 1.55rem;
  margin-bottom: 0.3rem;
}
#login .sub {
  color: var(--mu);
  font-size: 0.9rem;
  margin-bottom: 1.4rem;
}
#login .btn {
  width: 100%;
  margin-top: 1.25rem;
  padding: 12px;
  font-size: 0.95rem;
}

/* ========== App shell ========== */
#app {
  display: none;
  min-height: 100dvh;
}

/* Sidebar — always dark for consistent contrast */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: var(--sidebar-w);
  height: 100dvh;
  background: var(--sidebar-bg);
  color: #fff;
  display: flex;
  flex-direction: column;
  z-index: 40;
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 4px 0 24px rgba(0, 0, 0, 0.15);
}
.sidebar-brand {
  padding: 1.35rem 1.25rem 1.1rem;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  flex-shrink: 0;
}
.sidebar-brand .logo {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--li), #e8c96a);
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 0.85rem;
  color: #0b1f3a;
  letter-spacing: -0.03em;
}
.sidebar-brand h2 {
  font-size: 1.05rem;
  letter-spacing: 0.12em;
  font-weight: 700;
  color: #fff;
}
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 0.85rem 0.7rem;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 0;
}
.sidebar-nav button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  color: var(--sidebar-text);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.92rem;
  font-weight: 500;
  transition: background var(--transition), color var(--transition);
}
.sidebar-nav button:hover {
  background: rgba(255, 255, 255, 0.08);
  color: var(--sidebar-text-active);
}
.sidebar-nav button.on {
  background: rgba(255, 255, 255, 0.12);
  color: var(--sidebar-text-active);
  box-shadow: inset 3px 0 0 var(--li);
}
.sidebar-nav button .icon {
  width: 18px;
  height: 18px;
  opacity: 0.9;
  flex-shrink: 0;
}
.sidebar-footer {
  padding: 0.75rem 0.7rem 1.1rem;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  flex-shrink: 0;
}
.sidebar-footer button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  color: rgba(255, 255, 255, 0.55);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 500;
  transition: background var(--transition), color var(--transition);
}
.sidebar-footer button:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
}
.sidebar-footer button .icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

/* Overlay for mobile sidebar */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 35;
  backdrop-filter: blur(2px);
}
.sidebar-overlay.on { display: block; }

/* Main content */
.main {
  margin-left: var(--sidebar-w);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--ln);
  padding: 0.85rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 58px;
}
.menu-btn {
  display: none;
  background: none;
  border: 0;
  color: var(--ink);
  padding: 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-left: -4px;
}
.menu-btn:hover { background: var(--li-soft); }
.menu-btn svg { display: block; }
.topbar h1 {
  font-size: 1.35rem;
  flex: 1;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.content {
  padding: 1.5rem;
  flex: 1;
}

/* ========== Stats cards ========== */
.st {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 1.4rem;
}
.sc {
  background: var(--cd);
  border: 1px solid var(--ln);
  border-radius: var(--radius);
  padding: 1.15rem 1.25rem;
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition), border-color var(--transition);
}
.sc:hover {
  box-shadow: var(--shadow);
  border-color: var(--ln-strong);
}
.sc .label {
  font-size: 0.8rem;
  color: var(--mu);
  font-weight: 500;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sc b {
  display: block;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 1.65rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.2;
}

/* ========== Layout helpers ========== */
.two {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}
.two-bottom {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 14px;
}
.box {
  background: var(--cd);
  border: 1px solid var(--ln);
  border-radius: var(--radius);
  padding: 1.25rem;
  box-shadow: var(--shadow-sm);
}
.box h3 {
  font-size: 0.98rem;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.box h3 .muted {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--mu);
}

/* Chart bars */
.bars {
  display: flex;
  align-items: flex-end;
  gap: 5px;
  height: 150px;
  padding-top: 8px;
}
.bars div {
  flex: 1;
  background: linear-gradient(180deg, var(--li) 0%, var(--li-strong) 100%);
  border-radius: 5px 5px 2px 2px;
  min-height: 3px;
  transition: opacity 0.15s;
  cursor: default;
  position: relative;
}
.bars div:hover { opacity: 0.85; }
.bl {
  display: flex;
  gap: 5px;
  font-size: 0.65rem;
  color: var(--mu);
  margin-top: 8px;
}
.bl span {
  flex: 1;
  text-align: center;
}

/* Rows / lists inside boxes */
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--ln);
  gap: 12px;
  font-size: 0.9rem;
}
.row:last-child { border-bottom: 0; }
.row b { font-weight: 600; white-space: nowrap; }
.empty-state {
  color: var(--mu);
  font-size: 0.9rem;
  padding: 1.5rem 0;
  text-align: center;
}

/* Status pills */
.pill {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 0.76rem;
  font-weight: 600;
  text-transform: capitalize;
  background: var(--ln);
  color: var(--ink);
}
.pill.pending { background: #fef3c7; color: #92400e; }
.pill.confirmed { background: #dbeafe; color: #1e40af; }
.pill.shipped { background: #e0e7ff; color: #3730a3; }
.pill.delivered { background: #d1fae5; color: #065f46; }
.pill.cancelled { background: #fee2e2; color: #991b1b; }
.pill.returned { background: #f3e8ff; color: #6b21a8; }

@media (prefers-color-scheme: dark) {
  .pill.pending { background: rgba(251, 191, 36, 0.18); color: #fbbf24; }
  .pill.confirmed { background: rgba(59, 130, 246, 0.18); color: #93c5fd; }
  .pill.shipped { background: rgba(99, 102, 241, 0.18); color: #a5b4fc; }
  .pill.delivered { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; }
  .pill.cancelled { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
  .pill.returned { background: rgba(168, 85, 247, 0.18); color: #d8b4fe; }
}

/* ========== Tables ========== */
.tw {
  overflow-x: auto;
  background: var(--cd);
  border: 1px solid var(--ln);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  -webkit-overflow-scrolling: touch;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}
th, td {
  padding: 11px 16px;
  text-align: left;
  border-bottom: 1px solid var(--ln);
  white-space: nowrap;
}
th {
  color: var(--mu);
  font-weight: 500;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  background: var(--bg-2);
  position: sticky;
  top: 0;
}
tr:last-child td { border-bottom: 0; }
tr:hover td { background: var(--cd-hover); }
td img {
  width: 42px;
  height: 42px;
  object-fit: cover;
  border-radius: 7px;
}
td .actions {
  display: flex;
  gap: 6px;
}

/* Bulk bar */
.bulk {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
  align-items: center;
}
.bulk select, .bulk input {
  width: auto;
  min-width: 140px;
}
.bulk .spacer { flex: 1; min-width: 8px; }
.pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 14px;
  padding: 10px 0;
  font-size: 0.88rem;
  color: var(--mu);
}
.pager .pages {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.pager button {
  min-width: 34px;
  height: 34px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1.5px solid var(--ln);
  background: var(--cd);
  cursor: pointer;
  font-weight: 600;
  color: var(--ink);
}
.pager button.on, .pager button:hover:not(:disabled) {
  border-color: var(--li);
  background: var(--li-soft);
}
.pager button:disabled { opacity: 0.4; cursor: not-allowed; }
.search-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 14px;
}
.search-bar input {
  flex: 1;
  min-width: 160px;
}
#print-area {
  display: none !important;
}
@media print {
  body * { visibility: hidden !important; }
  #print-area {
    display: block !important;
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    visibility: visible !important;
  }
  #print-area * { visibility: visible !important; }
}
.invoice {
  font-family: 'DM Sans', system-ui, sans-serif;
  color: #0b1f3a;
  max-width: 800px;
  margin: 0 auto;
  padding: 32px;
  background: #fff;
}
.invoice-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  border-bottom: 3px solid #c9a14a;
  padding-bottom: 20px;
  margin-bottom: 24px;
}
.invoice-brand {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 1.6rem;
  letter-spacing: 0.14em;
  font-weight: 800;
}
.invoice-brand small {
  display: block;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  letter-spacing: 0;
  color: #5b6678;
  font-weight: 500;
  margin-top: 4px;
}
.invoice-meta { text-align: right; font-size: 0.9rem; color: #5b6678; }
.invoice-meta b { color: #0b1f3a; font-size: 1.05rem; }
.invoice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 28px;
  font-size: 0.92rem;
}
.invoice-grid h4 {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #5b6678;
  margin-bottom: 8px;
  font-weight: 600;
}
.invoice table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
  margin-bottom: 20px;
}
.invoice th {
  text-align: left;
  padding: 10px 12px;
  background: #f4f6f9;
  border-bottom: 2px solid #e5e9ef;
  color: #5b6678;
  font-weight: 600;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.invoice td {
  padding: 12px;
  border-bottom: 1px solid #eef1f5;
}
.invoice-totals {
  margin-left: auto;
  width: 260px;
  font-size: 0.92rem;
}
.invoice-totals .row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #eef1f5;
}
.invoice-totals .row.grand {
  font-weight: 700;
  font-size: 1.1rem;
  border-bottom: 0;
  border-top: 2px solid #0b1f3a;
  margin-top: 6px;
  padding-top: 10px;
}
.invoice-footer {
  margin-top: 36px;
  padding-top: 16px;
  border-top: 1px solid #eef1f5;
  font-size: 0.8rem;
  color: #5b6678;
  text-align: center;
}
.invoice-page-break { page-break-after: always; }

/* Header row */
.hd {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
}
.hd h2 { font-size: 1.45rem; }

/* ========== Modal ========== */
#md {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: none;
  place-items: center;
  z-index: 50;
  padding: 1rem;
  backdrop-filter: blur(3px);
}
#md.on { display: grid; }
#mb {
  background: var(--cd);
  border-radius: var(--radius-lg);
  padding: 1.6rem 1.5rem;
  max-width: 580px;
  width: 100%;
  max-height: 90dvh;
  overflow: auto;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--ln);
}
#mb h3 {
  font-size: 1.2rem;
  margin-bottom: 0.25rem;
}
.vr {
  display: grid;
  grid-template-columns: 1.6fr 1fr 0.8fr 0.7fr auto auto;
  gap: 6px;
  margin-bottom: 8px;
  align-items: center;
  padding: 8px;
  background: var(--bg-2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--ln);
}
.vr-img {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 70px;
}
.vr-img input[type=file] {
  font-size: 0.7rem;
  padding: 2px;
  width: 90px;
}
.v-thumb {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid var(--ln);
}
.pv {
  width: 88px;
  height: 88px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 8px;
  border: 1px solid var(--ln);
}
.gallery-box {
  margin-top: 4px;
}
.gallery-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}
.g-item {
  position: relative;
  width: 72px;
  height: 72px;
}
.g-item img {
  width: 72px;
  height: 72px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid var(--ln);
}
.g-item .btn {
  position: absolute;
  top: -6px;

/* ========== Responsive ========== */

<!-- Modal -->
<div id="md"><div id="mb"></div></div>

<script>
// 1) After deploying the Worker, paste its URL here
const API = localStorage.api || 'https://flat-unit-fb75.amworkmanage.workers.dev';
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const fmt = n => 'Rs ' + Math.round(n || 0).toLocaleString('en-PK');
let tok = localStorage.tok, tab = 'dash', cats = [];

async function call(path, method = 'GET', body, raw) {
  const headers = { Authorization: 'Bearer ' + tok };
  if (raw) headers['content-type'] = raw.type || 'application/octet-stream';
  else if (body !== undefined && body !== null && method !== 'GET' && method !== 'DELETE') {
    headers['content-type'] = 'application/json';
  }
  const r = await fetch(API + path, {
    method,
    headers,
    body: raw || (body !== undefined && body !== null && method !== 'GET' && method !== 'DELETE' ? JSON.stringify(body) : undefined)
  });
  if (r.status === 401) { logout(); throw new Error('Session expired'); }
  const text = await r.text();
  let d = {};
  try { d = text ? JSON.parse(text) : {}; } catch { d = { error: text || 'Invalid response' }; }
  if (!r.ok) {
    const msg = d.error || ('Request failed (' + r.status + ')');
    alert(msg);
    throw new Error(msg);
  }
  return d;
}

async function login(e) {
  e.preventDefault();
  try {
    const r = await fetch(API + '/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: $('#pw').value })
    });
    const d = await r.json();
    if (!r.ok) return alert(d.error);
    tok = localStorage.tok = d.token;
    boot();
  } catch {
    alert('Cannot reach the API. Check the API address at the top of admin.html.');
  }
}

function logout() {
  localStorage.removeItem('tok');
  tok = null;
  location.reload();
}

// field types: t=text n=number a=textarea i=image g=gallery c=category k=checkbox v=variants
const CFG = {
  products: {
    title: 'Products',
    cols: ['image', 'name', 'category', 'price', 'compare_price', 'active'],
    f: [
      ['name', 'Name'],
      ['category', 'Category', 'c'],
      ['price', 'Sale price (Rs)', 'n'],

      ['active', 'Visible in store', 'k']
    ]
  },
  categories: {
    title: 'Categories',
    cols: ['image', 'name', 'sort'],
    f: [
      ['name', 'Name'],
      ['image', 'Image', 'i'],
      ['sort', 'Sort order', 'n']
    ]
  },
  banners: {
    title: 'Banners',
    cols: ['image', 'title', 'subtitle', 'sort', 'active'],
    f: [
      ['title', 'Headline (e.g. Month-end sale)'],
      ['subtitle', 'Badge text (e.g. Limited time)'],
      ['button_text', 'Button text'],
      ['link', 'Button link (Sale, Basketball, all, or category name)'],
      ['image', 'Banner / sale image (upload)', 'i'],
      ['sort', 'Sort order (lower = first)', 'n'],
      ['active', 'Visible on homepage carousel', 'k']
    ]
  },
  delivery: {
    title: 'Delivery charges',
    cols: ['city', 'charge', 'free_above', 'active'],
    f: [
      ['city', 'City (use * for all other cities)'],
      ['charge', 'Delivery charge (Rs)', 'n'],
      ['free_above', 'Free delivery above (Rs, 0 = never)', 'n'],
      ['active', 'Active', 'k']
    ]
  },
  payments: {
    title: 'Payment methods',
    cols: ['name', 'account', 'proof', 'active'],
    f: [
      ['name', 'Method name (e.g. JazzCash)'],
      ['account', 'Account number / IBAN'],
      ['instructions', 'Instructions shown at checkout', 'a'],
      ['proof', 'Customer must send transaction ID + screenshot', 'k'],
      ['active', 'Active', 'k']
    ]
  }
};

const NAV = [
  ['dash', 'Dashboard', 'M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z'],
  ['orders', 'Orders', 'M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z'],
  ...Object.entries(CFG).map(([k, v]) => {
    const icons = {
      products: 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4',
      categories: 'M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z',
      banners: 'M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z',
      delivery: 'M8 17a2 2 0 100-4 2 2 0 000 4zm10 0a2 2 0 100-4 2 2 0 000 4zM3 5h2l1.5 6H16l2-5H6',
      payments: 'M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z'
    };
    return [k, v.title, icons[k] || 'M4 6h16M4 12h16M4 18h16'];
  })
];

function toggleSidebar() {
  $('#sidebar').classList.toggle('open');
  $('#overlay').classList.toggle('on');
}
function closeSidebar() {
  $('#sidebar').classList.remove('open');
  $('#overlay').classList.remove('on');
}

function boot() {
  $('#login').style.display = 'none';
  $('#app').style.display = 'block';
  $('#nav').innerHTML = NAV.map(([k, n, path]) =>
    `<button data-k="${k}" onclick="go('${k}')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"/></svg>
      ${n}
    </button>`
  ).join('');
  go('dash');
}

function go(k) {
  tab = k;
  closeSidebar();
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  const titles = { dash: 'Dashboard', orders: 'Orders', ...Object.fromEntries(Object.entries(CFG).map(([key, v]) => [key, v.title])) };
  $('#page-title').textContent = titles[k] || k;
  $('#page-actions').innerHTML = '';
  if (k === 'dash') dash();
  else if (k === 'orders') orders();
  else list(k);
}

/* ---------- dashboard ---------- */
async function dash() {
  $('#v').innerHTML = '<div class="loading"><div class="spinner"></div> Loading analytics…</div>';
  const a = await call('/api/admin/analytics');
  const days = Object.entries(a.days);
  const mx = Math.max(1, ...days.map(d => d[1].revenue));

  const statusHtml = Object.entries(a.byStatus).length
    ? Object.entries(a.byStatus).map(([s, n]) =>
        `<div class="row"><span class="pill ${esc(s)}">${esc(s)}</span><b>${n}</b></div>`
      ).join('')
    : '<div class="empty-state">No orders yet.</div>';

  const topHtml = a.top.length
    ? a.top.map(t =>
        `<div class="row"><span>${esc(t.name)} × ${t.qty}</span><b>${fmt(t.revenue)}</b></div>`
      ).join('')
    : '<div class="empty-state">No sales yet.</div>';

  const citiesHtml = a.cities.length
    ? a.cities.map(c =>
        `<div class="row"><span>${esc(c[0])}</span><b>${c[1]}</b></div>`
      ).join('')
    : '<div class="empty-state">No orders yet.</div>';

  const lowHtml = a.lowStock.length
    ? a.lowStock.map(l =>
        `<div class="row"><span>${esc(l.name)} (${esc(l.v)})</span><b style="color:var(--rd)">${l.stock}</b></div>`
      ).join('')
    : '<div class="empty-state" style="color:var(--gn)">All variants are stocked.</div>';

  $('#v').innerHTML = `
    <div class="st">
      <div class="sc">
        <div class="label">Revenue (excl. cancelled)</div>
        <b>${fmt(a.revenue)}</b>
      </div>
      <div class="sc">
        <div class="label">Total orders</div>
        <b>${a.orders}</b>
      </div>
      <div class="sc">
        <div class="label">Average order value</div>
        <b>${fmt(a.aov)}</b>
      </div>
      <div class="sc">
        <div class="label">Pending orders</div>
        <b>${a.byStatus.pending || 0}</b>
      </div>
    </div>

    <div class="two">
      <div class="box">
        <h3>Revenue, last 14 days <span class="muted">Daily</span></h3>
        <div class="bars">${days.map(([d, v]) =>
          `<div title="${d}: ${fmt(v.revenue)} (${v.orders} orders)" style="height:${Math.max(3, v.revenue / mx * 100)}%"></div>`
        ).join('')}</div>
        <div class="bl">${days.map(([d]) => `<span>${d.slice(8)}</span>`).join('')}</div>
      </div>
      <div class="box">
        <h3>Orders by status</h3>
        ${statusHtml}
      </div>
    </div>

    <div class="two-bottom">
      <div class="box">
        <h3>Top products</h3>
        ${topHtml}
      </div>
      <div class="box">
        <h3>Top cities</h3>
        ${citiesHtml}
        <h3 style="margin-top:1.4rem">Low stock</h3>
        ${lowHtml}
      </div>
    </div>
  `;
}

/* ---------- generic list + form ---------- */
function normalizeRow(r) {
  if (!r) return r;
  let variants = r.variants;
  if (typeof variants === 'string') {
    try { variants = JSON.parse(variants || '[]'); } catch { variants = []; }
  }
  if (!Array.isArray(variants)) variants = [];
  let gallery = r.gallery;
  if (typeof gallery === 'string') {
    try { gallery = JSON.parse(gallery || '[]'); } catch { gallery = []; }
  }
  if (!Array.isArray(gallery)) gallery = [];
  return { ...r, variants, gallery };
}

const PER_OPTS = [10, 30, 50, 100];

function pagerHtml(total, page, per, onPage, onPer) {
  const pages = Math.max(1, Math.ceil(total / per));
  const p = Math.min(page, pages);
  const from = total ? (p - 1) * per + 1 : 0;
  const to = Math.min(p * per, total);
  let btns = '';
  const start = Math.max(1, p - 2), end = Math.min(pages, p + 2);
  btns += `<button type="button" ${p <= 1 ? 'disabled' : ''} onclick="${onPage}(${p - 1})">‹</button>`;
  for (let i = start; i <= end; i++) {
    btns += `<button type="button" class="${i === p ? 'on' : ''}" onclick="${onPage}(${i})">${i}</button>`;
  }
  btns += `<button type="button" ${p >= pages ? 'disabled' : ''} onclick="${onPage}(${p + 1})">›</button>`;
  return `<div class="pager">
    <span>Showing ${from}–${to} of ${total}</span>
    <div class="pages">${btns}</div>
    <label style="display:flex;align-items:center;gap:6px;margin:0;color:var(--mu)">Rows
      <select onchange="${onPer}(+this.value)" style="width:auto;padding:6px 10px">
        ${PER_OPTS.map(n => `<option value="${n}" ${n === per ? 'selected' : ''}>${n}</option>`).join('')}
      </select>
    </label>
  </div>`;
}

function filterRows(rows, q) {
  if (!q) return rows;
  const s = q.toLowerCase();
  return rows.filter(r => JSON.stringify(r).toLowerCase().includes(s));
}

async function list(t) {
  const c = CFG[t];
  $('#v').innerHTML = '<div class="loading"><div class="spinner"></div> Loading…</div>';
  try {
    const rows = (await call('/api/admin/' + t)).map(normalizeRow);
    if (t === 'products' || t === 'categories') {
      cats = t === 'categories' ? rows : await call('/api/admin/categories');
    }
    window._allRows = rows;
    window._table = t;
    window._listQ = window._listQ && window._listTable === t ? window._listQ : '';
    window._listTable = t;
    window._listPage = 1;
    window._listPer = window._listPer || 10;
    $('#page-actions').innerHTML = `<button class="btn" type="button" onclick="openForm('${t}')">+ Add new</button>`;
    renderListPage();
  } catch (e) {
    $('#v').innerHTML = `<div class="empty-state">Failed to load. ${esc(e.message || '')}</div>`;
  }
}

function renderListPage() {
  const t = window._table;
  const c = CFG[t];
  if (!c) return;
  const q = window._listQ || '';
  const filtered = filterRows(window._allRows || [], q);
  window._rows = filtered;
  const per = window._listPer || 10;
  const pages = Math.max(1, Math.ceil(filtered.length / per));
  if (window._listPage > pages) window._listPage = pages;
  const page = window._listPage || 1;
  const slice = filtered.slice((page - 1) * per, page * per);

  const colLabels = {
    image: '', name: 'Name', category: 'Category', price: 'Price', compare_price: 'Compare',
    active: 'Active', sort: 'Sort', title: 'Title', subtitle: 'Subtitle', city: 'City',
    charge: 'Charge', free_above: 'Free above', account: 'Account', proof: 'Proof'
  };

  $('#v').innerHTML = `
    <div class="search-bar">
      <input id="lq" placeholder="Search ${c.title.toLowerCase()}…" value="${esc(q)}" onkeydown="if(event.key==='Enter')runListSearch()">
      <button class="btn" type="button" onclick="runListSearch()">Search</button>
      ${q ? `<button class="btn o" type="button" onclick="window._listQ='';window._listPage=1;renderListPage()">Clear</button>` : ''}
    </div>
    <div class="tw">
      <table>
        <thead>
          <tr>
            ${c.cols.map(k => `<th>${colLabels[k] || k.replace('_', ' ')}</th>`).join('')}
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${slice.map((r) => {
            const idx = filtered.indexOf(r);
            return `
              <tr>
                ${c.cols.map(k => {
                  if (k === 'image') return `<td>${r[k] ? `<img src="${esc(r[k])}" alt="">` : '—'}</td>`;
                  if (['active', 'proof'].includes(k)) return `<td>${r[k] ? '<span style="color:var(--gn);font-weight:600">Yes</span>' : '<span style="color:var(--mu)">No</span>'}</td>`;
                  if (['price', 'compare_price', 'charge', 'free_above'].includes(k)) return `<td>${fmt(r[k])}</td>`;
                  return `<td>${esc(r[k]) || '—'}</td>`;
                }).join('')}
                <td>
                  <div class="actions">
                    <button class="btn o s" type="button" onclick="openForm('${t}',${idx})">Edit</button>
                    <button class="btn r s" type="button" onclick="del('${t}',${r.id})">Delete</button>
                  </div>
                </td>
              </tr>`;
          }).join('') || `<tr><td colspan="${c.cols.length + 1}" style="text-align:center;padding:2.5rem;color:var(--mu)">${q ? 'No matches found.' : 'Nothing here yet. Click <b>+ Add new</b> to create the first one.'}</td></tr>`}
        </tbody>
      </table>
    </div>
    ${pagerHtml(filtered.length, page, per, 'gotoListPage', 'setListPer')}
  `;
}

function runListSearch() {
  window._listQ = ($('#lq') && $('#lq').value || '').trim();
  window._listPage = 1;
  renderListPage();
}
function gotoListPage(p) {
  window._listPage = Math.max(1, p);
  renderListPage();
}
function setListPer(n) {
  window._listPer = n;
  window._listPage = 1;
  renderListPage();
}

async function del(t, id) {
  if (!id) return alert('Missing item id.');
  if (!confirm('Delete this item? This cannot be undone.')) return;
  try {
    await call(`/api/admin/${t}/${id}`, 'DELETE');
    list(t);
  } catch (e) {
    alert(e.message || 'Delete failed');
  }
}

function openForm(t, i) {
  const c = CFG[t];
  if (!c) return alert('Unknown section: ' + t);
  const r = i === undefined ? { active: 1, variants: [], gallery: [] } : normalizeRow(window._rows[i] || { active: 1, variants: [], gallery: [] });
  const itemId = r.id || 0;

  try {
    $('#mb').innerHTML = `
      <h3>${i === undefined ? 'Add' : 'Edit'} ${c.title.toLowerCase().replace(/s$/, '')}</h3>
      ${c.f.map(([k, l, ty]) => {
        let v = r[k];
        if (v === undefined || v === null) v = (ty === 'v' || ty === 'g') ? [] : (ty === 'k' ? 0 : '');
        const fid = 'f_' + k;
        if (ty === 'a') return `<label for="${fid}">${l}</label><textarea id="${fid}" rows="3">${esc(v)}</textarea>`;
        if (ty === 'k') return `<label style="display:flex;align-items:center;gap:8px;margin-top:16px;cursor:pointer"><input type="checkbox" id="${fid}" ${v ? 'checked' : ''}> ${l}</label>`;
        if (ty === 'c') return `<label for="${fid}">${l}</label><select id="${fid}"><option value="">None</option>${(cats || []).map(x => `<option value="${esc(x.name)}" ${x.name === v ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>`;
        if (ty === 'i') return `<label for="${fid}">${l}</label><input type="file" accept="image/*" onchange="img(this,'${fid}')"><input type="hidden" id="${fid}" value="${esc(v)}"><img class="pv" id="${fid}_p" src="${esc(v)}" alt="" ${v ? '' : 'hidden'}>`;
        if (ty === 'g') {
          const list = Array.isArray(v) ? v : [];
          return `<label>${l}</label>
            <div class="gallery-box" id="gallery-box">
              <div class="gallery-list" id="gallery-list">${list.map(gThumb).join('')}</div>
              <input type="file" accept="image/*" multiple onchange="galleryAdd(this)">
              <p class="gallery-hint">Upload extra photos for the product page gallery</p>
            </div>`;
        }
        if (ty === 'v') {
          const list = Array.isArray(v) ? v : [];
          return `<label>${l}</label><div id="vs">${list.map(vr).join('')}</div><button class="btn o s" type="button" style="margin-top:6px" onclick="addVariant()">+ Add variant</button>`;
        }
        return `<label for="${fid}">${l}</label><input id="${fid}" type="${ty === 'n' ? 'number' : 'text'}" value="${esc(v)}" ${ty === 'n' ? 'step="any"' : ''}>`;
      }).join('')}
      <div class="ft">
        <button class="btn o" type="button" onclick="closeModal()">Cancel</button>
        <button class="btn" type="button" onclick="save('${t}',${itemId})">Save</button>
      </div>
    `;
    $('#md').classList.add('on');
  } catch (e) {
    alert('Could not open form: ' + (e.message || e));
  }
}

function closeModal() {
  $('#md').classList.remove('on');
}

function addVariant() {
  const vs = $('#vs');
  if (vs) vs.insertAdjacentHTML('beforeend', vr({}));
}

const gThumb = url => `
  <div class="g-item">
    <img src="${esc(url)}" alt="">
    <input type="hidden" class="g-url" value="${esc(url)}">
    <button type="button" class="btn r s" onclick="this.closest('.g-item').remove()">×</button>
  </div>`;

const vr = v => {
  v = v || {};
  const uid = 'vimg_' + Math.random().toString(36).slice(2, 9);
  return `
  <div class="vr">
    <input placeholder="Name e.g. 42 / Black" value="${esc(v.name || '')}">
    <input placeholder="SKU" value="${esc(v.sku || '')}">
    <input type="number" placeholder="Price (opt.)" value="${v.price || ''}" step="any">
    <input type="number" placeholder="Stock" value="${v.stock ?? ''}">
    <div class="vr-img">
      <input type="hidden" class="v-img-url" id="${uid}" value="${esc(v.image || '')}">
      <img class="v-thumb" id="${uid}_p" src="${esc(v.image || '')}" alt="" ${v.image ? '' : 'hidden'}>
      <input type="file" accept="image/*" onchange="img(this,'${uid}')" title="Variant image">
    </div>
    <button class="btn r s" type="button" onclick="this.closest('.vr').remove()">×</button>
  </div>`;
};

async function img(inp, fid) {
  const f = inp.files[0];
  if (!f) return;
  try {
    const d = await call('/api/admin/upload', 'POST', null, f);
    const hidden = document.getElementById(fid);
    if (hidden) hidden.value = d.url;
    const p = document.getElementById(fid + '_p');
    if (p) { p.src = d.url; p.hidden = false; }
  } catch (e) {
    alert(e.message || 'Upload failed');
  }
}

async function galleryAdd(inp) {
  const files = [...(inp.files || [])];
  if (!files.length) return;
  const list = $('#gallery-list');
  for (const f of files) {
    try {
      const d = await call('/api/admin/upload', 'POST', null, f);
      if (list) list.insertAdjacentHTML('beforeend', gThumb(d.url));
    } catch (e) {
      alert(e.message || 'Upload failed');
    }
  }
  inp.value = '';
}

async function save(t, id) {
  try {
    const b = {};
    CFG[t].f.forEach(([k, , ty]) => {
      if (ty === 'k') {
        const el = document.getElementById('f_' + k);
        b[k] = el && el.checked ? 1 : 0;
      } else if (ty === 'v') {
        b[k] = [...document.querySelectorAll('#vs .vr')].map(row => {
          const x = row.querySelectorAll('input:not([type=file]):not(.v-img-url)');
          const imgEl = row.querySelector('.v-img-url');
          return {
            name: (x[0] && x[0].value || '').trim(),
            sku: (x[1] && x[1].value || '').trim(),
            price: +(x[2] && x[2].value) || 0,
            stock: +(x[3] && x[3].value) || 0,
            image: (imgEl && imgEl.value) || ''
          };
        }).filter(v => v.name);
      } else if (ty === 'g') {
        b[k] = [...document.querySelectorAll('#gallery-list .g-url')].map(el => el.value).filter(Boolean);
      } else if (ty === 'n') {
        const el = document.getElementById('f_' + k);
        b[k] = el ? (+el.value || 0) : 0;
      } else {
        const el = document.getElementById('f_' + k);
        b[k] = el ? el.value : '';
      }
    });

    if (!(b.name || b.title || b.city)) {
      return alert('Please fill in the required name / title / city field.');
    }

    const path = id ? `/api/admin/${t}/${id}` : `/api/admin/${t}`;
    const method = id ? 'PUT' : 'POST';
    await call(path, method, b);
    closeModal();
    list(t);
  } catch (e) {
    alert(e.message || 'Save failed');
  }
}

/* ---------- orders ---------- */
const STAT = ['pending', 'confirmed', 'shipped', 'delivered', 'cancelled', 'returned'];

async function orders() {
  window._oPage = 1;
  window._oPer = window._oPer || 10;
  window._oQ = '';
  $('#page-actions').innerHTML = `
    <button class="btn o" type="button" onclick="printSelected()">Print selected</button>
    <button class="btn o" type="button" onclick="csv()">Export CSV</button>`;
  $('#v').innerHTML = `
    <div class="bulk">
      <input id="oq" placeholder="Search order no, name, phone…" style="flex:1;min-width:160px" onkeydown="if(event.key==='Enter')runOrderSearch()">
      <button class="btn" type="button" onclick="runOrderSearch()">Search</button>
      <select id="os" onchange="runOrderSearch()">
        <option value="">All statuses</option>
        ${STAT.map(s => `<option>${s}</option>`).join('')}
      </select>
      <span class="spacer"></span>
      <span style="font-size:0.85rem;color:var(--mu);white-space:nowrap">With selected:</span>
      <select id="bs">${STAT.map(s => `<option>${s}</option>`).join('')}</select>
      <button class="btn s" type="button" onclick="bulk('status')">Set status</button>
      <button class="btn s" type="button" onclick="bulk('courier')">Book courier</button>
      <button class="btn s" type="button" onclick="printSelected()">Print</button>
    </div>
    <div class="tw"><table id="ot"></table></div>
    <div id="opager"></div>
  `;
  await fetchOrders();
}

async function runOrderSearch() {
  window._oQ = ($('#oq') && $('#oq').value || '').trim();
  window._oPage = 1;
  await fetchOrders();
}

async function fetchOrders() {
  const q = window._oQ || '';
  const status = $('#os') ? $('#os').value : '';
  const rows = await call(`/api/admin/orders?status=${status}&q=${encodeURIComponent(q)}`);
  window._oAll = rows;
  renderOrdersPage();
}

function renderOrdersPage() {
  const rows = window._oAll || [];
  const per = window._oPer || 10;
  const pages = Math.max(1, Math.ceil(rows.length / per));
  if (window._oPage > pages) window._oPage = pages;
  const page = window._oPage || 1;
  const slice = rows.slice((page - 1) * per, page * per);
  window._o = slice;

  $('#ot').innerHTML = `
    <thead>
      <tr>
        <th><input type="checkbox" style="width:auto" onchange="document.querySelectorAll('.oc').forEach(c=>c.checked=this.checked)" aria-label="Select all"></th>
        <th>Order</th>
        <th>Customer</th>
        <th>City</th>
        <th>Total</th>
        <th>Payment</th>
        <th>Status</th>
        <th>Date</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      ${slice.map((o, i) => `
        <tr>
          <td><input class="oc" type="checkbox" style="width:auto" value="${o.id}" data-idx="${i}"></td>
          <td><b>${esc(o.order_no)}</b></td>
          <td>${esc(o.name)}<br><small style="color:var(--mu)">${esc(o.phone)}</small></td>
          <td>${esc(o.city)}</td>
          <td>${fmt(o.total)}</td>
          <td>${esc(o.payment)}</td>
          <td>
            <span class="pill ${esc(o.status)}">${esc(o.status)}</span>
            ${o.tracking ? `<br><small style="color:var(--mu)">${esc(o.courier)} ${esc(o.tracking)}</small>` : ''}
          </td>
          <td>${(o.created_at || '').slice(0, 10)}</td>
          <td>
            <div class="actions">
              <button class="btn o s" type="button" onclick="ov(${i})">View</button>
              <button class="btn o s" type="button" onclick="printOrders([window._o[${i}]])">Print</button>
            </div>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="9" style="text-align:center;padding:2.5rem;color:var(--mu)">No orders found.</td></tr>'}
    </tbody>
  `;
  if ($('#opager')) $('#opager').innerHTML = pagerHtml(rows.length, page, per, 'gotoOrderPage', 'setOrderPer');
}

function gotoOrderPage(p) {
  window._oPage = Math.max(1, p);
  renderOrdersPage();
}
function setOrderPer(n) {
  window._oPer = n;
  window._oPage = 1;
  renderOrdersPage();
}

async function bulk(action) {
  const ids = [...document.querySelectorAll('.oc:checked')].map(c => +c.value);
  if (!ids.length) return alert('Select at least one order.');
  if (!confirm(`${action === 'courier' ? 'Book courier for' : 'Update'} ${ids.length} order(s)?`)) return;
  const r = await call('/api/admin/orders/bulk', 'POST', { ids, action, status: $('#bs').value });
  const bad = r.filter(x => x.error);
  if (bad.length) alert(`${r.length - bad.length} done, ${bad.length} failed:\n` + bad.map(x => '#' + x.id + ': ' + x.error).join('\n'));
  await fetchOrders();
}

function printSelected() {
  const ids = new Set([...document.querySelectorAll('.oc:checked')].map(c => +c.value));
  if (!ids.size) return alert('Select at least one order to print.');
  const list = (window._oAll || []).filter(o => ids.has(o.id));
  printOrders(list);
}

function invoiceHtml(o) {
  let it = [];
  try { it = JSON.parse(o.items || '[]'); } catch { it = []; }
  const date = (o.created_at || '').slice(0, 16).replace('T', ' ');
  return `
  <div class="invoice invoice-page-break">
    <div class="invoice-header">
      <div class="invoice-brand">FARFITS<small>Premium Footwear · Karachi</small></div>
      <div class="invoice-meta">
        <div><b>INVOICE</b></div>
        <div>Order <b>${esc(o.order_no)}</b></div>
        <div>${esc(date)}</div>
        <div style="margin-top:6px;text-transform:capitalize">Status: <b>${esc(o.status)}</b></div>
      </div>
    </div>
    <div class="invoice-grid">
      <div>
        <h4>Bill to</h4>
        <div><b>${esc(o.name)}</b></div>
        <div>${esc(o.phone)}</div>
        ${o.email ? `<div>${esc(o.email)}</div>` : ''}
        <div>${esc(o.address)}</div>
        <div>${esc(o.city)}</div>
      </div>
      <div>
        <h4>Payment & shipping</h4>
        <div>Payment: <b>${esc(o.payment)}</b></div>
        ${o.tid ? `<div>Txn ID: ${esc(o.tid)}</div>` : ''}
        ${o.courier ? `<div>Courier: ${esc(o.courier)}</div>` : ''}
        ${o.tracking ? `<div>Tracking: ${esc(o.tracking)}</div>` : ''}
      </div>
    </div>
    <table>
      <thead>
        <tr><th>Item</th><th>Variant</th><th>Qty</th><th>Price</th><th>Amount</th></tr>
      </thead>
      <tbody>
        ${it.map(x => `
          <tr>
            <td>${esc(x.name)}</td>
            <td>${esc(x.v || '—')}</td>
            <td>${x.qty}</td>
            <td>${fmt(x.price)}</td>
            <td>${fmt(x.price * x.qty)}</td>
          </tr>`).join('') || '<tr><td colspan="5">No items</td></tr>'}
      </tbody>
    </table>
    <div class="invoice-totals">
      <div class="row"><span>Subtotal</span><span>${fmt(o.subtotal)}</span></div>
      <div class="row"><span>Shipping</span><span>${fmt(o.shipping)}</span></div>
      <div class="row grand"><span>Total</span><span>${fmt(o.total)}</span></div>
    </div>
    <div class="invoice-footer">
      FARFITS · Block H North Nazimabad Town, Karachi · +92 334 2907793<br>
      Thank you for shopping with us.
    </div>
  </div>`;
}

function printOrders(list) {
  if (!list || !list.length) return;
  let area = document.getElementById('print-area');
  if (!area) {
    area = document.createElement('div');
    area.id = 'print-area';
    document.body.appendChild(area);
  }
  area.innerHTML = list.map(invoiceHtml).join('');
  const cleanup = () => { area.innerHTML = ''; };
  window.addEventListener('afterprint', cleanup, { once: true });
  window.print();
  // Fallback if afterprint doesn't fire
  setTimeout(cleanup, 1000);
}

function ov(i) {
  const o = window._o[i];
  if (!o) return;
  let it = [];
  try { it = JSON.parse(o.items || '[]'); } catch { it = []; }
  $('#mb').innerHTML = `
    <h3>${esc(o.order_no)}</h3>
    <p style="margin-top:6px">${esc(o.name)} · <a href="tel:${esc(o.phone)}" style="color:var(--li)">${esc(o.phone)}</a>${o.email ? ' · ' + esc(o.email) : ''}</p>
    <p style="color:var(--mu);font-size:0.9rem;margin-top:2px">${esc(o.address)}, ${esc(o.city)}</p>
    <div style="margin:16px 0">
      ${it.map(x => `<div class="row"><span>${esc(x.name)} ${esc(x.v)} × ${x.qty}</span><span>${fmt(x.price * x.qty)}</span></div>`).join('')}
      <div class="row"><span>Delivery</span><span>${fmt(o.shipping)}</span></div>
      <div class="row"><b>Total (${esc(o.payment)})</b><b>${fmt(o.total)}</b></div>
    </div>
    ${o.tid ? `<p style="margin-bottom:8px">Transaction ID: <b>${esc(o.tid)}</b></p>` : ''}
    ${o.proof ? `<a href="${esc(o.proof)}" target="_blank" rel="noopener"><img class="pv" style="width:140px;height:140px" src="${esc(o.proof)}" alt="Payment proof"></a>` : ''}
    <label for="o_s">Status</label>
    <select id="o_s">${STAT.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <label for="o_c">Courier</label>
    <input id="o_c" value="${esc(o.courier)}">
    <label for="o_t">Tracking number</label>
    <input id="o_t" value="${esc(o.tracking)}">
    <div class="ft">
      <button class="btn o" type="button" onclick="printOrders([window._o[${i}]])">Print invoice</button>
      <button class="btn o" type="button" onclick="closeModal()">Close</button>
      <button class="btn" type="button" onclick="so(${o.id})">Save</button>
    </div>
  `;
  $('#md').classList.add('on');
}

async function so(id) {
  await call('/api/admin/orders/' + id, 'PUT', {
    status: $('#o_s').value,
    courier: $('#o_c').value,
    tracking: $('#o_t').value
  });
  closeModal();
  await fetchOrders();
}

function csv() {
  const rows = window._oAll || window._o || [];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const h = ['order_no', 'name', 'phone', 'city', 'address', 'total', 'payment', 'status', 'created_at'];
  const b = new Blob([[h.join(','), ...rows.map(o => h.map(k => q(o[k])).join(','))].join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'orders.csv';
  a.click();
}

$('#md').addEventListener('click', e => {
  if (e.target.id === 'md') e.target.classList.remove('on');
});

if (tok) boot();
